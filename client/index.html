<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Parent's Portal</title>
    <!-- Text size (Settings -> Personalization) is stored on this device only.
         Applied here, synchronously, BEFORE the module bundle loads, so the
         first paint is already at the chosen size - no flash from Normal to
         Large. Mirrors src/pages/settings/textSize.js (same key, same class);
         keep the two in step by hand. try/catch: private windows and blocked
         storage throw, and the page must still load. -->
    <script>
      try {
        if (localStorage.getItem('pp.textSize') === 'large') {
          document.documentElement.classList.add('text-large');
        }
      } catch (e) {}
    </script>
    <!-- Theme (Settings -> Personalization), same idea: read BEFORE the bundle so
         the first paint is already Light or Dark. Mirrors
         src/pages/settings/theme.js (same key, same rules: 'dark' is dark,
         'system' follows prefers-color-scheme, anything else is light); keep
         the two in step by hand. Dark also paints <html> itself (background +
         color-scheme) because in dev the stylesheet arrives from JS and the
         canvas would flash white first; theme.js clears those two inline styles
         on every apply so a runtime switch back to Light does not keep them. -->
    <script>
      try {
        var pref = localStorage.getItem('pp.theme');
        var dark =
          pref === 'dark' ||
          (pref === 'system' &&
            window.matchMedia &&
            window.matchMedia('(prefers-color-scheme: dark)').matches);
        var html = document.documentElement;
        html.setAttribute('data-theme', dark ? 'dark' : 'light');
        if (dark) {
          html.style.colorScheme = 'dark';
          html.style.backgroundColor = 'oklch(12.9% 0.042 264.695)'; /* slate-950, as in theme.js */
        }
      } catch (e) {}
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
