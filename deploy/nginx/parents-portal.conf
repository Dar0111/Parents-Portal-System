# Parent's Portal System — the Nginx site for the Hostinger VPS.
#
# __DOMAIN__ is a PLACEHOLDER. Replace every occurrence with the real domain
# when installing (deploy/README.md step 7). Nothing in this file is a secret:
# no address but the loopback the API listens on, no key, no password.
#
# Installed as /etc/nginx/sites-available/parents-portal.conf and symlinked
# into sites-enabled. This is the PRE-TLS source: `certbot --nginx` edits the
# INSTALLED copy, adding its own 443 server block and the HTTP redirect. The
# repo copy deliberately stays at port 80 — if you ever copy it over the
# installed one again, re-run certbot (README step 8).

# Socket.io needs the hop-by-hop Connection header to follow Upgrade: on a
# WebSocket handshake it must be "upgrade", and on the polling transport —
# which Socket.io falls back to and which the clients still list
# (client/src/realtime/SocketProvider.jsx) — it must be "close". A fixed
# "upgrade" breaks polling. A `map` belongs to the http context, which is
# where sites-enabled files are included.
map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

server {
    listen 80;
    listen [::]:80;
    server_name __DOMAIN__ www.__DOMAIN__;

    # A profile photo is capped at 5 MB by multer
    # (server/utils/profilePhoto.js MAX_BYTES). Nginx's own default is 1 MB
    # and would answer 413 before Express ever saw the request, so the app's
    # own refusal message would never reach the user.
    client_max_body_size 8m;

    # NO Content-Security-Policy. client/index.html carries an inline script
    # that applies the stored theme before the bundle loads (FRONTEND §8); a
    # script-src 'self' would make every first paint flash light.
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    root /home/portal/Parents_Portal/client/dist;
    index index.html;

    # THE SPA FALLBACK. server.js 404s every unknown path, so without this a
    # reload of a deep link such as /admin/activity-log would answer the API's
    # JSON "Route not found." instead of the app.
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Vite writes content-hashed file names into dist/assets, so a long cache
    # is safe: a changed file has a different name. index.html is NOT in here
    # and stays uncached, which is what lets a deploy take effect.
    location /assets/ {
        try_files $uri =404;
        access_log off;
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # The restore is synchronous by decision (CLAUDE.md → RESTORE) and a
    # backup archive streams a ZIP, so these get their own, longer read
    # timeout. This block is a longer prefix than /api/ and therefore wins
    # for these paths.
    location /api/backups {
        proxy_pass http://127.0.0.1:5000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 600s;
        proxy_send_timeout 600s;
        # A download must arrive as a file, not be held in a buffer.
        proxy_buffering off;
    }

    # X-Forwarded-For is what `app.set('trust proxy', 'loopback')` in
    # server.js reads back as req.ip — the value behind the sign-in throttle,
    # the per-IP code limits and every login_attempts.ip row. Do not remove it.
    location /api/ {
        proxy_pass http://127.0.0.1:5000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;
    }

    # Profile photos. Served by Express, not from disk here, so its own
    # headers hold: index off, dotfiles denied, nosniff, private caching
    # (server/server.js). Both clients build this address by stripping /api
    # from the API base (client/src/format/photoUrl.js).
    location /uploads/ {
        proxy_pass http://127.0.0.1:5000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Socket.io attaches to the HTTP server root at its default path
    # (server/socket.js), so it is a sibling of /api, not under it. The long
    # read timeout keeps an idle live channel open; without it Nginx would cut
    # the socket every 60 seconds and the LiveStatus strip would flap.
    location /socket.io/ {
        proxy_pass http://127.0.0.1:5000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
        proxy_buffering off;
    }
}
